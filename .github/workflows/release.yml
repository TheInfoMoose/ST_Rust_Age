name: Release Builds

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for actions/attest-build-provenance
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: simply-transfer-ui.exe
            archive_name: simply-transfer-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: simply-transfer-ui
            archive_name: simply-transfer-macos-silicon.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: simply-transfer-ui
            archive_name: simply-transfer-macos-intel.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: simply-transfer-ui
            archive_name: simply-transfer-linux-x86_64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release (Unix)
        if: runner.os != 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/simply-transfer-ui .
          tar -czvf ${{ matrix.archive_name }} simply-transfer-ui

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        run: |
          mv target\${{ matrix.target }}\release\simply-transfer-ui.exe .
          Compress-Archive -Path simply-transfer-ui.exe -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ matrix.archive_name }}

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive_name }}
