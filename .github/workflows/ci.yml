name: Rust CI

on:
  push:
    branches: [ "main", "feature/pipeline-optimization" ]
  pull_request:
    branches: [ "main", "feature/pipeline-optimization" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install dependencies (Linux)
      run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libsecret-1-dev

    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
      
    - name: Format
      run: cargo fmt --all -- --check
      
    - name: Clippy
      run: cargo clippy -- -D warnings
      
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo-audit
        run: cargo audit --ignore RUSTSEC-2025-0141
