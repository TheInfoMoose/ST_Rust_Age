[package]
name = "simply-transfer-link"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "net", "time", "sync", "fs"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
