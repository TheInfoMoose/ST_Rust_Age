[package]
name = "simply-transfer-link"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "aws-lc-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
simply-transfer-snapshots = { version = "0.1.0", path = "../simply-transfer-snapshots" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "net", "time", "sync", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
