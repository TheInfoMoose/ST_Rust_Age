[package]
name = "simply-transfer-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
notify-rust = "4.18.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simply-transfer-core = { version = "0.1.0", path = "../simply-transfer-core" }
simply-transfer-crypto = { version = "0.1.0", path = "../simply-transfer-crypto" }
simply-transfer-snapshots = { version = "0.1.0", path = "../simply-transfer-snapshots" }
slint = "1.18.1"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
bytemuck = { version = "1.21.0", features = ["derive"] }
strict-num = "0.1"
russh-keys = "0.45.0"

[build-dependencies]
slint-build = "1.18.1"
