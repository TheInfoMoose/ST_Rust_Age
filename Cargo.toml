[workspace]
members = [
    "simply-transfer-core",
    "simply-transfer-ui",
    "simply-transfer-snapshots",
    "simply-transfer-crypto"
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
ttf-parser = { git = "https://github.com/RazrFalcon/ttf-parser" }
